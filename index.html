<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من الشهادات | أكاديمية بلاتينيوم</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fa;color:#17254a;margin:0}.bar{background:#142451;color:white;padding:23px;text-align:center;border-bottom:5px solid #c9a24a}.wrap{max-width:640px;margin:38px auto;padding:18px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:28px;box-shadow:0 5px 18px #14245112}input{box-sizing:border-box;width:100%;font:inherit;padding:14px;border:1px solid #c6cbd5;border-radius:9px;direction:ltr;margin:14px 0}button{font:inherit;background:#142451;color:white;padding:12px 25px;border:0;border-radius:9px;cursor:pointer}.result{margin-top:20px;line-height:2}.good{color:#147747}.bad{color:#ad3529}dt{color:#667}dd{margin:0 0 9px;font-weight:bold}footer{text-align:center;color:#777;font-size:13px;margin:24px}</style></head><body><div class="bar"><h1>أكاديمية بلاتينيوم للتدريب</h1><p>التحقق الرسمي من صحة الشهادات | PLATINUM ACADEMY</p></div><main class="wrap"><section class="card"><h2>التحقق من الشهادة</h2><p>أدخل رقم الشهادة المطبوع عليها أو امسح رمز QR للوصول لهذه الصفحة.</p><form id="form"><label for="no">رقم الشهادة</label><input id="no" placeholder="PTA-2026-0001" maxlength="64" required><button type="submit">تحقق من الشهادة</button></form><div id="result" class="result" role="status" aria-live="polite"></div></section><footer>© Platinum Academy — Since 2012</footer></main><script>
const URL='https://pdnkggxvmyxdnuyulxke.supabase.co',KEY='sb_publishable_ABB5lEuYrAj_qDEGqVWcTw_WQP1auPu';const form=document.getElementById('form'),field=document.getElementById('no'),result=document.getElementById('result');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function verify(q){result.textContent='جارٍ التحقق من السجل الرسمي…';try{const response=await fetch(URL+'/rest/v1/rpc/platinum_verify_certificate',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({p_query:q})});if(!response.ok)throw new Error('تعذر الاتصال بخدمة التحقق ('+response.status+')');const rows=await response.json();if(!rows.length){result.innerHTML='<p class="bad">لم يتم العثور على شهادة بهذا الرقم في السجل الرسمي.</p>';return}const r=rows[0];const valid=r.status==='valid';result.innerHTML='<h3 class="'+(valid?'good':'bad')+'">'+(valid?'✓ شهادة مسجلة وسارية':'✕ شهادة ملغاة / غير سارية')+'</h3><dl><dt>رقم الشهادة</dt><dd>'+esc(r.certificate_no)+'</dd><dt>اسم الطالب</dt><dd>'+esc(r.student_name_ar)+'</dd><dt>Student</dt><dd>'+esc(r.student_name_en)+'</dd><dt>الدورة</dt><dd>'+esc(r.course_name_ar)+'</dd><dt>Course</dt><dd>'+esc(r.course_name_en)+'</dd><dt>تاريخ الإصدار</dt><dd>'+esc(r.issued_on)+'</dd></dl>'}catch(e){result.innerHTML='<p class="bad">تعذّر التحقق حاليًا. تأكد من تشغيل ملف SQL ونشر الصفحة على الاستضافة. '+esc(e.message)+'</p>'}}
form.addEventListener('submit',e=>{e.preventDefault();const q=field.value.trim();if(q)verify(q)});const p=new URLSearchParams(location.search).get('no');if(p){field.value=p;verify(p)}
</script></body></html>
